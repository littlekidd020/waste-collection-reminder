name: BinDayNZ
options:
  bundleIdPrefix: com.bindaynz
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: 4
    INFOPLIST_FILE: BinDayNZ/Info.plist

targets:
  BinDayNZ:
    type: application
    platform: iOS
    sources:
      - path: BinDayNZ
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bindaynz.app
        INFOPLIST_FILE: BinDayNZ/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        CODE_SIGN_ENTITLEMENTS: BinDayNZ/BinDayNZ.entitlements
    entitlements:
      path: BinDayNZ/BinDayNZ.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bindaynz.app
        com.apple.developer.usernotifications.time-sensitive: true
    dependencies:
      - target: BinDayNZWidgetExtension

  BinDayNZWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BinDayNZWidget
        excludes:
          - Info.plist
      - path: BinDayNZ/Models/BinType.swift
      - path: BinDayNZ/Models/CollectionSchedule.swift
      - path: BinDayNZ/Models/CollectionZone.swift
      - path: BinDayNZ/Models/UpcomingCollection.swift
      - path: BinDayNZ/Services/ScheduleEngine.swift
      - path: BinDayNZ/Services/LanguageManager.swift
      - path: BinDayNZ/Views/Shared/BinLidChip.swift
      - path: BinDayNZ/Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bindaynz.app.widget
        INFOPLIST_FILE: BinDayNZWidget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: BinDayNZWidget/BinDayNZWidgetExtension.entitlements
    entitlements:
      path: BinDayNZWidget/BinDayNZWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bindaynz.app

  BinDayNZTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BinDayNZTests
    dependencies:
      - target: BinDayNZ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bindaynz.app.tests
        GENERATE_INFOPLIST_FILE: true

  BinDayNZUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BinDayNZUITests
    dependencies:
      - target: BinDayNZ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bindaynz.app.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: BinDayNZ

schemes:
  BinDayNZ:
    build:
      targets:
        BinDayNZ: all
    test:
      targets:
        - BinDayNZTests
        - BinDayNZUITests
