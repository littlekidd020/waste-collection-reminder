name: BinDayNZ
options:
  bundleIdPrefix: com.bindaynz
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only
    INFOPLIST_FILE: BinDayNZ/Info.plist

targets:
  BinDayNZ:
    type: application
    platform: iOS
    sources:
      - path: BinDayNZ
        excludes:
          - Info.plist
    resources:
      - path: BinDayNZ/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bindaynz.app
        INFOPLIST_FILE: BinDayNZ/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: BinDayNZ/BinDayNZ.entitlements
    entitlements:
      path: BinDayNZ/BinDayNZ.entitlements
      properties: {}
    dependencies:
      - target: BinDayNZWidgetExtension

  BinDayNZWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BinDayNZWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bindaynz.app.widget
        INFOPLIST_FILE: BinDayNZWidget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_ENTITLEMENTS: BinDayNZWidget/BinDayNZWidgetExtension.entitlements
    entitlements:
      path: BinDayNZWidget/BinDayNZWidgetExtension.entitlements
      properties: {}
