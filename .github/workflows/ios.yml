# CI for BinDayNZ: localisation check, build, and unit tests on an iOS Simulator.
# UI tests (BinDayNZUITests) are deliberately skipped: they need Springboard
# permission dialogs, which are not reliable on hosted runners.
name: iOS CI

on:
  push:          # every branch
  pull_request:

# Cancel superseded runs on the same ref (branch or PR).
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    # BINDAYNZ_ISOLATED_CALENDAR_TESTS is intentionally NOT set anywhere, so the
    # calendar integration tests skip themselves.
    steps:
      - uses: actions/checkout@v4

      # Newest stable Xcode installed on the runner image.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Must run from the repo root; exits non-zero on failure.
      - name: Check localisations
        run: python3 scripts/check-localizations.py

      - run: xcodegen generate

      - name: Build (iOS Simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project BinDayNZ.xcodeproj \
            -scheme BinDayNZ \
            -destination 'generic/platform=iOS Simulator' \
            -resultBundlePath Build.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # Pick the first available iPhone simulator on this runner; fall back to
      # iPhone 16 by name if parsing finds nothing.
      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep -E '^ +iPhone ' | head -n 1 \
            | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}' || true)
          if [ -n "$UDID" ]; then
            echo "DEST=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"
          else
            echo "DEST=platform=iOS Simulator,name=iPhone 16" >> "$GITHUB_ENV"
          fi

      # Unit tests only; UI tests are excluded via -only-testing.
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project BinDayNZ.xcodeproj \
            -scheme BinDayNZ \
            -destination "$DEST" \
            -only-testing:BinDayNZTests \
            -resultBundlePath Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload result bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: "*.xcresult"
          if-no-files-found: ignore
